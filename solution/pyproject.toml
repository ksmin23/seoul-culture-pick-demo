[project]
name = "seoul-culture-pick"
version = "0.1.0"
description = "서울 전시 추천 — OpenAI Agents SDK + Streamlit 교육용 데모"
requires-python = ">=3.12"
dependencies = [
  "openai-agents==0.22.3",
  "streamlit==1.64.0",
  "python-dotenv==1.2.3",
  "httpx==0.28.1",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.9"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "scripts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
